[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "dealzora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
sha2 = "0.10"
hex="0.4"
hmac = "0.12"
rand = "0.8"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
machine-uid = "0.6.0"

[target."cfg(windows)".dependencies]
winreg = "0.52"
win32job = "2"
