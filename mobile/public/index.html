<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: المحتوى يمتد تحت شريط الحالة وأسفل الآيفون، والمسافات الآمنة من react-native-safe-area-context -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>Dealzora سلسلة</title>
    <meta
      name="description"
      content="متابعة فروع محلك: المبيعات، التحويلات، التنبيهات، وملخص يومك"
    />

    <!-- PWA: التثبيت على الشاشة الرئيسية (أندرويد والآيفون) -->
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/png" href="/icons/icon-512.png" />

    <!-- الآيفون: «إضافة إلى الشاشة الرئيسية» من Safari تفتحه كتطبيق بلا شريط المتصفح -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dealzora" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        /* لا ارتداد للصفحة كلها عند السحب في Safari (التمرير داخل الشاشات فقط) */
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        background-color: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0a0a0a;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>فعّل JavaScript لتشغيل Dealzora.</noscript>
    <div id="root"></div>
  </body>
</html>
